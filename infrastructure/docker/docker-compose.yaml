name: bookhive
services:
  postgres-db:
    image: postgres:15
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - ../postgres/init:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  kafka:
    image: apache/kafka:4.0.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:29093
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    ports:
      - "9092:9092"

  discovery-service:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
      args:
        SERVICE_NAME: DiscoveryService
    ports:
      - "8761:8761"

  identity-service:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
      args:
        SERVICE_NAME: IdentityService
    depends_on:
      - postgres-db
      - discovery-service
    environment:
      - SPRING_DATASOURCE_URL=${DB_URL_IDENTITY}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=${DB_DRIVER}
      - SPRING_JPA_DATABASE_PLATFORM=${DB_PLATFORM}
      - EUREKA_CLIENT_SERVICE_URL=${EUREKA_URL}
      - EUREKA_INSTANCE_HOSTNAME=${EUREKA_HOSTNAME_IDENTITY}
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=${EUREKA_PREFER_IP}
      - H2_CONSOLE_ENABLED=${H2_ENABLED}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_TOKEN_EXPIRATION=${JWT_ACCESS_TOKEN_EXPIRATION}

  catalog-service:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
      args:
        SERVICE_NAME: CatalogService
    depends_on:
      - postgres-db
      - discovery-service
    environment:
      - SPRING_DATASOURCE_URL=${DB_URL_CATALOG}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=${DB_DRIVER}
      - SPRING_JPA_DATABASE_PLATFORM=${DB_PLATFORM}
      - EUREKA_CLIENT_SERVICE_URL=${EUREKA_URL}
      - EUREKA_INSTANCE_HOSTNAME=${EUREKA_HOSTNAME_CATALOG}
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=${EUREKA_PREFER_IP}
      - H2_CONSOLE_ENABLED=${H2_ENABLED}

  order-service:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
      args:
        SERVICE_NAME: OrderService
    depends_on:
      - postgres-db
      - discovery-service
    environment:
      - SPRING_DATASOURCE_URL=${DB_URL_ORDER}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=${DB_DRIVER}
      - SPRING_JPA_DATABASE_PLATFORM=${DB_PLATFORM}
      - EUREKA_CLIENT_SERVICE_URL=${EUREKA_URL}
      - EUREKA_INSTANCE_HOSTNAME=${EUREKA_HOSTNAME_ORDER}
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=${EUREKA_PREFER_IP}
      - H2_CONSOLE_ENABLED=${H2_ENABLED}

  gateway-service:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
      args:
        SERVICE_NAME: GatewayService
    depends_on:
      - discovery-service
    environment:
      - EUREKA_CLIENT_SERVICE_URL=${EUREKA_URL}
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=${EUREKA_PREFER_IP}
      - JWT_SECRET=${JWT_SECRET}
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  kafka_data:
